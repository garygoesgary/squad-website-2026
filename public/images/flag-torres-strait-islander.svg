<svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Torres Strait Islander Flag">
  <defs>
    <clipPath id="tsi-outer">
      <rect x="0" y="0" width="30" height="20" rx="2" ry="2" />
    </clipPath>
  </defs>
  <g clip-path="url(#tsi-outer)">
    <rect width="30" height="20" fill="#12386e" />
    <rect width="30" height="4" fill="#00843d" />
    <rect y="16" width="30" height="4" fill="#00843d" />
    <rect y="3.35" width="30" height="1.3" fill="#000000" />
    <rect y="15.35" width="30" height="1.3" fill="#000000" />

    <!-- dhari (headdress): two pointed horn-like lobes meeting at a
         centre notch, hanging down to points on either side, star
         nested in the gap beneath -->
    <path
      d="M9.3 13.2
         C8.7 10.2 8.9 6.8 12 5.1
         C13.1 6.4 14 7.4 15 7.6
         C16 7.4 16.9 6.4 18 5.1
         C21.1 6.8 21.3 10.2 20.7 13.2
         C19.2 10.6 17.5 9.6 15 9.6
         C12.5 9.6 10.8 10.6 9.3 13.2 Z"
      fill="#ffffff"
    />

    <!-- 5-point star -->
    <polygon
      points="15.00,8.60 15.62,10.45 17.57,10.47 16.00,11.62 16.59,13.48 15.00,12.35 13.41,13.48 14.00,11.62 12.43,10.47 14.38,10.45"
      fill="#ffffff"
    />
  </g>
</svg>
